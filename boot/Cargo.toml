[package]
name = "rocky-boot"
version = "0.1.0"
edition = "2021"
description = "Sector de arranque BIOS de rocky (carga el kernel y entra en modo largo)"

[[bin]]
name = "boot"
path = "src/main.rs"

[[bin]]
name = "bootusb"
path = "src/bin/bootusb.rs"

[[bin]]
name = "bootusb2"
path = "src/bin/bootusb2.rs"

[profile.release]
panic = "abort"
opt-level = 1
lto = false
